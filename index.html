*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
/* One family for titles and text; mono only for numbers and small labels.

body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--display); font-size: 15px; line-height: 1.6;
}
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.small-label, .kicker, .fig-num, nav button .num, .frame-foot, dt, .card h3, .group-head, .axis text {
  font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase;
}

/* Masthead */
.masthead .page { padding-top: 48px; }
.kicker { margin: 0 0 16px; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 4.4vw, 3.4rem);
     line-height: 1.08; letter-spacing: -0.02em; color: var(--title); }
.lead { margin: 16px 0 0; color: var(--muted); max-width: 62ch; font-size: 1.05rem; }

/* Views: folder tabs attached to the panel below. The active tab joins the panel;
   the others sit behind it, in grey. */
nav { display: flex; align-items: flex-end; gap: 4px; margin-top: 40px; padding-left: 16px;
      border-bottom: 1px solid var(--hair); overflow-x: auto; overflow-y: hidden; }
nav button {
  font: inherit; font-size: 14px; color: var(--muted); background: var(--band); cursor: pointer; white-space: nowrap;
  border: 1px solid var(--rule); border-bottom: none; border-radius: 4px 4px 0 0;
  padding: 9px 18px 8px; margin-bottom: 0; display: inline-flex; align-items: baseline; gap: 8px;
  position: relative; top: 0; transition: background 0.15s ease, color 0.15s ease, top 0.15s ease;
}
nav button .num { font-family: var(--mono); font-size: 11px; color: var(--faint); }
nav button .name { font-weight: 700; }
nav button:hover { color: var(--ink); background: var(--rule); top: -2px; }
nav button[aria-selected="true"] {
  color: var(--ink); background: var(--surface); border-color: var(--hair); cursor: default;
  padding: 12px 20px 11px; top: 1px; z-index: 1;                 /* covers the line: joined to the panel */
}
nav button[aria-selected="true"] .num { color: var(--ink); }

/* The panel the tabs belong to */
.layout { background: var(--surface); border: 1px solid var(--hair); border-top: none; padding: 24px 24px 20px; }

/* Figure: title block across the width; chart and panel start on the same rule */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; column-gap: 32px; align-items: start; margin-top: 0; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.frame-head { grid-column: 1 / -1; padding-bottom: 16px; }
.frame { margin: 0; }
.fig-num { margin: 0 0 8px; color: var(--faint); }
.frame-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.25;
                 letter-spacing: -0.01em; color: var(--title); }
.note { margin: 8px 0 0; color: var(--muted); max-width: 80ch; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-top: 16px; }
.controls:has(#toggle-wrap[hidden]):has(#chips[hidden]):has(#figpick[hidden]) { display: none; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.toggle[hidden] { display: none; }
#chart { background: var(--surface); border-top: 1px solid var(--hair); }
#chart svg { display: block; width: 100%; height: auto; touch-action: none; }
#chart text { font-family: var(--display); fill: var(--ink); }
.empty-state { padding: 48px 24px; color: var(--muted); text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: var(--muted);
          padding: 12px 0; border-top: 1px solid var(--rule); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.frame-foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 8px 0 0;

.frame-foot strong { color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; }

.edge { fill: none; stroke: var(--link); stroke-width: 1; stroke-opacity: 0.6; }

.hub { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4px; cursor: grab; }
.selected { stroke: var(--ink); stroke-width: 2.8px; }
.hub.selected { stroke: var(--accent); stroke-width: 3.2px; }
.label { font-size: 12px; font-weight: 700; pointer-events: none;

.axis text { fill: var(--muted); text-transform: none; letter-spacing: 0; }
.axis path, .axis line { stroke: var(--rule); }
.year-grid line { stroke: var(--rule); stroke-dasharray: 2 4; }
.xlink { fill: none; stroke-width: 1.2; }
.row-label { font-size: 12.5px; cursor: pointer; }
#chart .group-head { font-family: var(--mono); }

.swatch { width: 0.62rem; height: 0.62rem; border-radius: 50%; display: inline-block; }
.swatch.hub-swatch { background: var(--surface); border: 1.4px solid var(--ink); width: 0.78rem; height: 0.78rem; }
.line-sample { display: inline-block; width: 1.6rem; height: 0; border-top: 2px solid var(--muted); }
.line-sample.dashed { border-top-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chips[hidden] { display: none; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted);

.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--hair); }

.card { position: relative; border-top: 1px solid var(--hair); padding: 16px 0; }

nav[hidden] { display: none; }

.tip[hidden] { display: none; }
.mark { cursor: pointer; }
.mark.selected-mark { stroke: var(--ink); stroke-width: 2.4px; }
.nodata { fill: var(--rule); opacity: 0.6; }
footer { color: var(--muted); font-size: 13px; padding: 16px 0 48px; border-top: 1px solid var(--hair); margin-top: 48px; }
footer p { margin: 0.2rem 0; }
</style>
</head>

/* ---------------------------------------------------------------
   The four maps: hubs (datasets, solvers, references) linked to studies
   --------------------------------------------------------------- */
function countHubs(pairs) {
  const counts = new Map();
  pairs.forEach(([, key]) => counts.set(key, (counts.get(key) || 0) + 1));
  return counts;
}

const SOURCE_CHARTING = "Charting of the included studies by the authors of the review.";
const SOURCE_SCOPUS = "Reference lists from Scopus (Elsevier); charting by the authors of the review.";

const VIEWS = {
  validation: {
    title: "Experimental datasets used to validate the studies",
    source: SOURCE_CHARTING,
    drift: true,
    singlesText: "Show datasets used by one study only",
    build() {
      const pairs = studies.flatMap(s => s.datasets.map(k => [s.tag, k]));
      const counts = countHubs(pairs);
      const hubs = [...counts].map(([key, n]) => ({ key, label: datasetLabel(key), count: n, kind: "dataset" }));
      const linked = new Set(pairs.map(p => p[0])).size;

      const note = `${linked} studies validated against ${counts.size} external datasets (open circles). ` +

/* ---------------------------------------------------------------
   Rendering: shared setup (zoom, drag, hover, fit to frame)
   --------------------------------------------------------------- */
let simulation = null;

function frame() {
  const chart = document.getElementById("chart");
  chart.replaceChildren();
  const width = Math.max(chart.clientWidth, 320);
  const height = Math.round(Math.min(680, Math.max(460, width * 0.62)));
  const svg = d3.select(chart).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const layer = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.4, 8]).on("zoom", e => layer.attr("transform", e.transform));
  svg.call(zoom).on("dblclick.zoom", null);
  return { svg, layer, zoom, width, height };
}

function fitToFrame(f, nodes, margin = 30, maxScale = 1.25) {
  const x0 = d3.min(nodes, d => d.x - d.r), x1 = d3.max(nodes, d => d.x + d.r);
  const y0 = d3.min(nodes, d => d.y - d.r - 18), y1 = d3.max(nodes, d => d.y + d.r);
  const scale = Math.min(maxScale, (f.width - 2 * margin) / (x1 - x0 || 1), (f.height - 2 * margin) / (y1 - y0 || 1));
  const t = d3.zoomIdentity.translate(f.width / 2 - scale * (x0 + x1) / 2, f.height / 2 - scale * (y0 + y1) / 2).scale(scale);
  f.svg.call(f.zoom.transform, t);
}

let applyFocus = null;     // highlights the selected item in the current view (set by each view)
const locked = () => !!state.selected;    // a click locks the highlight; hovering is then ignored

// A click on empty space clears the selection
function clearOnBackground(svg) {
  svg.on("click", e => { if (!e.target.closest("circle, .hit, .mark")) select(null); });
}

function interactions(nodeSel, edgeSel, labelSel, nodes, edges, sim, fixX) {
  // Drag: the rest of the network follows
  nodeSel.call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = fixX ? d.x : e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(sim.baseTarget || 0); d.fx = null; d.fy = null; }));

  // Hover: highlight the node and its direct connections
  const near = new Map(nodes.map(d => [d.key, new Set([d.key])]));
  edges.forEach(l => { near.get(l.source.key).add(l.target.key); near.get(l.target.key).add(l.source.key); });
  const focusKey = key => {
    if (key === null || !near.has(key)) {
      nodeSel.style("opacity", null); labelSel.style("opacity", null);
      edgeSel.style("stroke-opacity", null).style("stroke", null);
      return;
    }
    const set = near.get(key);
    nodeSel.style("opacity", n => set.has(n.key) ? 1 : 0.12);
    labelSel.style("opacity", n => set.has(n.key) ? 1 : 0.12);
    edgeSel.style("stroke-opacity", l => l.source.key === key || l.target.key === key ? 0.95 : 0.05)
           .style("stroke", l => l.source.key === key || l.target.key === key ? cssVar("--ink") : null);
  };
  nodeSel.on("mouseenter", (e, d) => { if (!locked()) focusKey(d.key); })
         .on("mouseleave", () => { if (!locked()) focusKey(null); });
  return focusKey;
}

/* ---------------------------------------------------------------
   Hub maps: validation datasets, numerical models, most cited references
   --------------------------------------------------------------- */
function renderHubMap(spec, view) {
  const minCount = view.singlesText && !state.toggles[state.view] ? 2 : 1;
  const hubs = spec.hubs.filter(h => h.count >= minCount).map(h => ({ ...h, key: "h:" + h.key, id: h.key,
               r: 6 + 3.2 * Math.sqrt(h.count) }));
  const hubKeys = new Set(hubs.map(h => h.id));
  const pairs = spec.pairs.filter(([, k]) => hubKeys.has(k));
  const tags = [...new Set(pairs.map(p => p[0]))];
  const studyNodes = tags.map(t => ({ key: "s:" + t, tag: t, kind: "study", r: 5, device: byTag.get(t).device }));
  const nodes = [...hubs, ...studyNodes];
  const edges = pairs.map(([t, k]) => ({ source: "s:" + t, target: "h:" + k }));

  const f = frame();
  const edgeSel = f.layer.append("g").selectAll("line").data(edges).join("line").attr("class", "edge");
  const nodeSel = f.layer.append("g").selectAll("circle").data(nodes).join("circle")
    .attr("r", d => d.r)
    .attr("class", d => d.kind === "study" ? "study" : "hub")
    .attr("fill", d => d.kind === "study" ? deviceColor(d.device) : null)
    .on("click", (e, d) => select(d.kind === "study" ? { type: "study", tag: d.tag } : { type: "hub", hub: d, spec }));
  nodeSel.append("title").text(d => d.kind === "study" ? studyLabel(byTag.get(d.tag))
                                    : `${d.label}: ${plural(d.count, "study", "studies")}`);
  const labelSel = f.layer.append("g").selectAll("text").data([]).join("text");   // filled after the layout

  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.key).distance(l => 14 + l.target.r).strength(0.9))
    .force("charge", d3.forceManyBody().strength(d => d.kind === "study" ? -22 : -180 - 12 * d.count))
    .force("collide", d3.forceCollide(d => d.r + (d.kind === "study" ? 1.5 : 6)))
    .force("x", d3.forceX(f.width / 2).strength(0.045))
    .force("y", d3.forceY(f.height / 2).strength(0.06))
    .stop();
  for (let i = 0; i < 400; i++) simulation.tick();

  const draw = () => {
    edgeSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeSel.attr("cx", d => d.x).attr("cy", d => d.y);
    labelSel.attr("x", d => d.x).attr("y", d => d.y - d.r - 6);
  };
  // Labels of the hubs, largest first, skipping any that would overlap one already placed
  const boxes = [], labelled = [];
  for (const h of [...hubs].sort((a, b) => b.count - a.count)) {
    if (!(spec.allLabels || h.count >= 3 || hubs.length <= 25)) continue;
    const w = h.label.length * 6.8, box = [h.x - w / 2, h.y - h.r - 20, h.x + w / 2, h.y - h.r - 4];
    if (boxes.some(b => box[0] < b[2] && b[0] < box[2] && box[1] < b[3] && b[1] < box[3])) continue;
    boxes.push(box); labelled.push(h);
  }
  const labelSel2 = f.layer.append("g").selectAll("text").data(labelled).join("text")
    .attr("class", "label").attr("text-anchor", "middle").text(d => d.label);
  const drawAll = () => { draw(); labelSel2.attr("x", d => d.x).attr("y", d => d.y - d.r - 6); };
  drawAll();
  fitToFrame(f, nodes);
  simulation.on("tick", drawAll);

  // Very slow drift around the resting layout (off for users who ask for reduced motion)
  if (view.drift && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    nodes.forEach((n, i) => { n.phase = (i * 2.39996) % (2 * Math.PI); });
    simulation.force("drift", () => {
      const t = performance.now() / 1000;
      for (const n of nodes) {
        if (n.fx != null) continue;                       // not while being dragged
        n.vx += 0.012 * Math.sin(0.22 * t + n.phase);
        n.vy += 0.012 * Math.cos(0.17 * t + 1.3 * n.phase);
      }
    });
    simulation.baseTarget = 0.03;
    simulation.velocityDecay(0.55).alphaDecay(0).alpha(0.03).alphaTarget(0.03).restart();
  }
  const focusKey = interactions(nodeSel, edgeSel, labelSel2, nodes, edges, simulation, false);
  clearOnBackground(f.svg);
  applyFocus = () => {
    markSelection(nodeSel);
    const s = state.selected;
    focusKey(!s ? null : s.type === "study" ? "s:" + s.tag : s.hub.key);
  };
  applyFocus();
  legend(studyNodes.map(n => n.device), spec.hubName);
}

/* ---------------------------------------------------------------
   SPH references: grouped references (left) linked to the citing studies (right)
   --------------------------------------------------------------- */
const REF_GROUPS = (DATA.referenceGroups || []).map(g => [g, g]);      // as arranged in reference_groups.md
const groupName = g => g;
const groupColor = g => cssVar(`--g${(REF_GROUPS.findIndex(x => x[0] === g) % 6) + 1}`);
const refLabel = r => r.label || r.id;
const refHub = r => ({ key: "h:" + r.id, id: r.id, kind: "reference", label: refLabel(r), count: r.citers.length, ref: r });
state.groups = new Set(REF_GROUPS.map(g => g[0]));

function renderChips() {
  const box = document.getElementById("chips");
  box.replaceChildren();
  for (const [g, name] of REF_GROUPS) {
    const n = DATA.references.filter(r => r.group === g).length;
    if (!n) continue;
    const b = el("button", { class: "chip", "aria-pressed": String(state.groups.has(g)) });
    const sw = el("span", { class: "swatch" }); sw.style.background = groupColor(g);
    b.appendChild(sw); b.appendChild(document.createTextNode(`${name} (${n})`));
    b.addEventListener("click", () => {
      if (state.groups.has(g)) state.groups.delete(g); else state.groups.add(g);
      render();
    });
    box.appendChild(b);
  }
}

function renderExplorer(spec) {
  renderChips();
  const perGroup = state.toggles.references ? Infinity : 12;            // top 12 per group unless "Show all"
  const refs = REF_GROUPS.flatMap(([g]) => DATA.references.filter(r => r.group === g && state.groups.has(g))
                                                         .sort((a, b) => b.citers.length - a.citers.length)
                                                         .slice(0, perGroup));
  const chart = document.getElementById("chart");
  chart.replaceChildren();
  if (!refs.length) { chart.appendChild(el("p", { class: "empty-state" }, "Select at least one group above.")); legend([]); return; }

  const width = Math.max(chart.clientWidth, 320);
  const narrow = width < 640;
  const row = 18, head = 28, m = { top: 12, bottom: 16 };
  // left column: group headings and references
  const left = []; let y = m.top;
  REF_GROUPS.forEach(([g]) => {
    const items = refs.filter(r => r.group === g);
    if (!items.length) return;
    y += 8; left.push({ type: "head", g, y: y + 10 }); y += head - 8;
    items.forEach(r => { left.push({ type: "ref", r, y: y + row / 2 }); y += row; });
  });
  const leftHeight = y - m.top;
  // right column: citing studies in chronological order, spread over the same height
  const tags = [...new Set(refs.flatMap(r => r.citers))].map(t => byTag.get(t))
    .sort((a, b) => a.year - b.year || a.tag - b.tag);
  const rowR = Math.max(14, Math.min(22, leftHeight / tags.length));
  const height = m.top + m.bottom + Math.max(leftHeight, rowR * tags.length);
  const yStudy = new Map(tags.map((s, i) => [s.tag, m.top + rowR * (i + 0.5) + (leftHeight > rowR * tags.length ? (leftHeight - rowR * tags.length) / 2 : 0)]));

  const xRefText = width * (narrow ? 0.44 : 0.34);
  const xBar = xRefText + 8, barMax = narrow ? 24 : 44;
  const xFrom = xBar + barMax + 6;
  const xStudyText = width * (narrow ? 0.58 : 0.68);
  const xTo = xStudyText - 14;
  const maxCount = d3.max(refs, r => r.citers.length);

  const svg = d3.select(chart).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const links = refs.flatMap(r => r.citers.map(t => ({ r, tag: t })));
  const yRef = new Map(left.filter(d => d.type === "ref").map(d => [d.r.id, d.y]));
  const curve = d => {
    const y0 = yRef.get(d.r.id), y1 = yStudy.get(d.tag), mid = (xFrom + xTo) / 2;
    return `M${xFrom},${y0}C${mid},${y0} ${mid},${y1} ${xTo},${y1}`;
  };
  const linkSel = svg.append("g").selectAll("path").data(links).join("path").attr("class", "xlink")
    .attr("d", curve).attr("stroke", d => groupColor(d.r.group)).attr("stroke-opacity", 0.07);

  svg.append("g").selectAll("text").data(left.filter(d => d.type === "head")).join("text")
    .attr("class", "group-head").attr("x", xRefText).attr("y", d => d.y).attr("text-anchor", "end")
    .style("fill", d => groupColor(d.g)).text(d => groupName(d.g));
  const refRows = svg.append("g").selectAll("g").data(left.filter(d => d.type === "ref")).join("g")
    .attr("transform", d => `translate(0,${d.y})`).style("cursor", "pointer")
    .attr("class", "hit")
    .on("mouseenter", (e, d) => { if (!locked()) focus({ kind: "ref", id: d.r.id }); })
    .on("mouseleave", () => { if (!locked()) focus(null); })
    .on("click", (e, d) => select({ type: "hub", hub: refHub(d.r), spec }));
  refRows.append("rect").attr("x", 0).attr("y", -row / 2).attr("width", xFrom).attr("height", row).attr("fill", "transparent");
  refRows.append("text").attr("class", "row-label").attr("x", xRefText).attr("dy", "0.35em").attr("text-anchor", "end")
    .text(d => refLabel(d.r)).append("title").text(d => d.r.title);
  refRows.append("rect").attr("x", xBar).attr("y", -3.5).attr("height", 7).attr("rx", 2)
    .attr("width", d => Math.max(2, barMax * d.r.citers.length / maxCount)).attr("fill", d => groupColor(d.r.group));
  refRows.append("title").text(d => `${d.r.title} (cited by ${plural(d.r.citers.length, "study", "studies")})`);

  const studyRows = svg.append("g").selectAll("g").data(tags).join("g")
    .attr("transform", s => `translate(0,${yStudy.get(s.tag)})`).style("cursor", "pointer")
    .attr("class", "hit")
    .on("mouseenter", (e, s) => { if (!locked()) focus({ kind: "study", tag: s.tag }); })
    .on("mouseleave", () => { if (!locked()) focus(null); })
    .on("click", (e, s) => select({ type: "study", tag: s.tag }));
  studyRows.append("rect").attr("x", xTo).attr("y", -rowR / 2).attr("width", width - xTo).attr("height", rowR).attr("fill", "transparent");
  studyRows.append("circle").attr("cx", xStudyText - 7).attr("r", 4).attr("fill", s => deviceColor(s.device));
  studyRows.append("text").attr("class", "row-label").attr("x", xStudyText).attr("dy", "0.35em")
    .text(s => s.label);

  function pinned() {
    const s = state.selected;
    if (!s) return null;
    if (s.type === "study") return { kind: "study", tag: s.tag };
    if (s.hub.kind === "reference") return { kind: "ref", id: s.hub.id };
    return null;
  }
  function focus(f) {
    if (!f) {
      linkSel.attr("stroke-opacity", 0.07).attr("stroke-width", 1.2);
      refRows.style("opacity", null); studyRows.style("opacity", null).style("font-weight", null);
      return;
    }
    const on = f.kind === "ref" ? l => l.r.id === f.id : l => l.tag === f.tag;
    const refsOn = new Set(links.filter(on).map(l => l.r.id));
    const studiesOn = new Set(links.filter(on).map(l => l.tag));
    linkSel.attr("stroke-opacity", l => on(l) ? 0.85 : 0.02).attr("stroke-width", l => on(l) ? 1.6 : 1.2);
    linkSel.filter(on).raise();
    refRows.style("opacity", d => refsOn.has(d.r.id) ? 1 : 0.25);
    studyRows.style("opacity", s => studiesOn.has(s.tag) ? 1 : 0.25)
             .style("font-weight", s => f.kind === "study" && s.tag === f.tag ? 700 : null);
  }
  clearOnBackground(svg);
  applyFocus = () => focus(pinned());
  applyFocus();
  legend(tags.map(s => s.device));
  document.getElementById("legend").lastChild.textContent = "Bars show how many included studies cite each reference.";
}

/* ---------------------------------------------------------------
   Citations between studies: a timeline (x = publication year)
   --------------------------------------------------------------- */
function renderTimeline() {
  const cited = new Map(), citing = new Map();
  DATA.citations.forEach(([a, b]) => { cited.set(b, (cited.get(b) || 0) + 1); citing.set(a, (citing.get(a) || 0) + 1); });
  const tags = [...new Set(DATA.citations.flat())];
  const lane = d => d === "PA-OWC" ? "OWC" : d;
  const nodes = tags.map(t => ({ key: t, tag: t, kind: "study", device: byTag.get(t).device, lane: lane(byTag.get(t).device),
                                 year: +byTag.get(t).year, cited: cited.get(t) || 0,
                                 r: 4.5 + 2 * Math.sqrt(cited.get(t) || 0) }));
  const nodeOf = new Map(nodes.map(n => [n.key, n]));
  const edges = DATA.citations.map(([a, b]) => ({ source: nodeOf.get(a), target: nodeOf.get(b) }));

  const chart = document.getElementById("chart");
  chart.replaceChildren();
  const width = Math.max(chart.clientWidth, 320);
  const lanes = [...d3.rollup(nodes, v => v.length, d => d.lane)].sort((a, b) => b[1] - a[1]).map(d => d[0]);
  const laneHeight = d => Math.max(70, 26 * Math.sqrt(nodes.filter(n => n.lane === d).length));
  const m = { left: 64, right: 24, top: 18, bottom: 40 };
  const height = m.top + m.bottom + d3.sum(lanes, laneHeight);
  const svg = d3.select(chart).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const years = d3.extent(nodes, d => d.year);
  const x = d3.scaleLinear().domain([years[0] - 0.5, years[1] + 0.5]).range([m.left, width - m.right]);
  const laneTop = new Map(); let acc = m.top;
  lanes.forEach(l => { laneTop.set(l, acc); acc += laneHeight(l); });
  const laneMid = l => laneTop.get(l) + laneHeight(l) / 2;

  svg.append("g").attr("class", "year-grid").selectAll("line").data(d3.range(years[0], years[1] + 1)).join("line")
    .attr("x1", d => x(d)).attr("x2", d => x(d)).attr("y1", m.top).attr("y2", height - m.bottom);
  svg.append("g").selectAll("line").data(lanes.slice(1)).join("line")
    .attr("x1", 0).attr("x2", width).attr("y1", l => laneTop.get(l)).attr("y2", l => laneTop.get(l))
    .attr("stroke", cssVar("--rule"));
  svg.append("g").selectAll("text").data(lanes).join("text")
    .attr("x", 12).attr("y", l => laneMid(l)).attr("dy", "0.35em").attr("font-size", 13).attr("font-weight", 600)
    .style("fill", l => deviceColor(l)).text(l => l);
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - m.bottom})`)
    .call(d3.axisBottom(x).ticks(width < 600 ? 6 : years[1] - years[0] + 1).tickFormat(d3.format("d")));

  nodes.forEach(d => { d.x = x(d.year); d.y = laneMid(d.lane) + ((d.tag * 37) % 40 - 20); });   // stable start
  simulation = d3.forceSimulation(nodes)
    .force("x", d3.forceX(d => x(d.year)).strength(0.9))
    .force("y", d3.forceY(d => laneMid(d.lane)).strength(0.35))
    .force("collide", d3.forceCollide(d => d.r + 2.5))
    .stop();
  for (let i = 0; i < 300; i++) simulation.tick();
  nodes.forEach(d => {
    const top = laneTop.get(d.lane) + d.r + 4, bottom = laneTop.get(d.lane) + laneHeight(d.lane) - d.r - 4;
    d.y = Math.max(top, Math.min(bottom, d.y));
  });

  const layer = svg.append("g");
  const arc = d => {                       // smooth S-curve, as in the references view
    const mid = (d.source.x + d.target.x) / 2;
    return `M${d.source.x},${d.source.y}C${mid},${d.source.y} ${mid},${d.target.y} ${d.target.x},${d.target.y}`;
  };
  const edgeSel = layer.append("g").selectAll("path").data(edges).join("path").attr("class", "edge")
    .style("stroke-opacity", 0.22);
  const nodeSel = layer.append("g").selectAll("circle").data(nodes).join("circle")
    .attr("r", d => d.r).attr("class", "study").attr("fill", d => deviceColor(d.device))
    .on("click", (e, d) => select({ type: "study", tag: d.tag }));
  nodeSel.append("title").text(d => `${studyLabel(byTag.get(d.tag))}: cited by ${d.cited}, cites ${citing.get(d.tag) || 0} included studies`);
  // labels for the most cited studies, skipping any that would overlap one already placed
  const top = [], boxes = [];
  for (const d of [...nodes].sort((a, b) => b.cited - a.cited).filter(d => d.cited >= 2).slice(0, 12)) {
    const w = byTag.get(d.tag).label.length * 6.6, box = [d.x - w / 2, d.y - d.r - 19, d.x + w / 2, d.y - d.r - 3];
    if (boxes.some(b => box[0] < b[2] && b[0] < box[2] && box[1] < b[3] && b[1] < box[3])) continue;
    boxes.push(box); top.push(d);
  }
  const labelSel = layer.append("g").selectAll("text").data(top).join("text")
    .attr("class", "label").attr("text-anchor", "middle").text(d => byTag.get(d.tag).label);

  const draw = () => {
    edgeSel.attr("d", arc);
    nodeSel.attr("cx", d => d.x).attr("cy", d => d.y);
    labelSel.attr("x", d => d.x).attr("y", d => d.y - d.r - 5);
  };
  draw();
  simulation.on("tick", draw);
  interactions(nodeSel, edgeSel, labelSel, nodes, edges, simulation, true);

  // Highlight one study: solid curves to what it cites, dashed curves from what cites it,
  // both in the colour of the highlighted study
  function focus(tag) {
    if (tag === null) {
      nodeSel.style("opacity", null); labelSel.style("opacity", null);
      edgeSel.style("stroke", null).style("stroke-opacity", 0.22).style("stroke-dasharray", null).style("stroke-width", null);
      return;
    }
    const colour = deviceColor(byTag.get(tag).device);
    const mine = l => l.source.tag === tag || l.target.tag === tag;
    const cites = new Set(edges.filter(l => l.source.tag === tag).map(l => l.target.tag));
    const citedBy = new Set(edges.filter(l => l.target.tag === tag).map(l => l.source.tag));
    const near = n => n.tag === tag || cites.has(n.tag) || citedBy.has(n.tag);
    nodeSel.style("opacity", n => near(n) ? 1 : 0.12);
    labelSel.style("opacity", n => near(n) ? 1 : 0.12);
    edgeSel
      .style("stroke", l => mine(l) ? colour : null)
      .style("stroke-opacity", l => mine(l) ? 0.9 : 0.04)
      .style("stroke-width", l => mine(l) ? 1.6 : null)
      .style("stroke-dasharray", l => l.target.tag === tag ? "5 4" : null);
    edgeSel.filter(mine).raise();
  }
  const pinnedTag = () => state.selected && state.selected.type === "study" && nodes.some(n => n.tag === state.selected.tag)
    ? state.selected.tag : null;
  nodeSel.on("mouseenter", (e, d) => { if (!locked()) focus(d.tag); })
         .on("mouseleave", () => { if (!locked()) focus(null); });
  clearOnBackground(svg);
  applyFocus = () => { markSelection(nodeSel); focus(pinnedTag()); };
  applyFocus();

  const box = document.getElementById("legend");
  box.replaceChildren();
  const item = (cls, text) => { const sp = el("span"); sp.appendChild(el("span", { class: cls })); sp.appendChild(document.createTextNode(text)); box.appendChild(sp); };
  item("line-sample", "Cites (earlier studies)");
  item("line-sample dashed", "Cited by (later studies)");
  box.appendChild(el("span", {}, "Hover a circle, or click to keep it; click empty space to clear."));
}

/* ---------------------------------------------------------------
   Selection card
   --------------------------------------------------------------- */
function select(item) {
  const same = state.selected && item && state.selected.type === item.type &&
               (item.type === "study" ? state.selected.tag === item.tag : state.selected.hub.key === item.hub.key);
  state.selected = same ? null : item;
  renderCard();
  if (applyFocus) applyFocus();
}

function markSelection(sel) {
  const s = state.selected;
  sel.classed("selected", d => !!s && (s.type === "study" ? d.tag === s.tag && d.kind === "study"
                                                          : d.key === s.hub.key));
}

function renderCard() {
  const card = document.getElementById("card");
  card.replaceChildren();
  const s = state.selected;
  if (!s) { card.appendChild(el("p", { class: "hint" }, "Select a circle or a name to see the details here.")); return; }
  const close = el("button", { class: "close", "aria-label": "Close" }, "×");
  close.addEventListener("click", () => select(null));
  card.appendChild(close);

  const studyList = tags => {
    const ul = el("ul");
    tags.map(t => byTag.get(t)).sort((a, b) => a.year - b.year).forEach(st => {
      const li = el("li"); const b = el("button", {}, studyLabel(st));
      b.addEventListener("click", () => select({ type: "study", tag: st.tag }));
      li.appendChild(b); ul.appendChild(li);
    });
    return ul;
  };

  if (s.type === "study") {
    const st = byTag.get(s.tag);
    card.appendChild(el("h2", {}, studyLabel(st)));
    card.appendChild(el("p", {}, st.title));
    const meta = el("p", { class: "meta" }, `${st.authors.replace(/\.$/, "")}. ${st.journal}. `);
    if (st.doi) meta.appendChild(el("a", { href: `https://doi.org/${st.doi}`, target: "_blank", rel: "noopener" }, "Open the paper"));
    card.appendChild(meta);
    const dl = el("dl");
    const row = (k, v) => { dl.appendChild(el("dt", {}, k)); dl.appendChild(el("dd", {}, v)); };
    row("Device", st.device);
    if (!DATA.figuresOnly) row("Solver", st.solver || "Not reported");
    if (!DATA.figuresOnly)
      row("Validated against", st.datasets.map(datasetLabel).join(", ") || (st.own ? "Own experiments" : "No reference data"));
    card.appendChild(dl);

    // Citations view: the included studies it cites and that cite it
    if (state.view === "citations") {
      const cites = DATA.citations.filter(c => c[0] === st.tag).map(c => c[1]);
      const citedBy = DATA.citations.filter(c => c[1] === st.tag).map(c => c[0]);
      card.appendChild(el("h3", {}, `Cites (${cites.length})`));
      card.appendChild(cites.length ? studyList(cites) : el("p", { class: "meta" }, "No included study."));
      card.appendChild(el("h3", {}, `Cited by (${citedBy.length})`));
      card.appendChild(citedBy.length ? studyList(citedBy) : el("p", { class: "meta" }, "No included study."));
    }

    // References view: the SPH references it builds on
    const cited = state.view === "references" ? (DATA.references || []).filter(r => r.citers.includes(st.tag)) : [];
    if (cited.length) {
      card.appendChild(el("h3", {}, "Builds on (most cited references)"));
      REF_GROUPS.forEach(([g, name]) => {
        const items = cited.filter(r => r.group === g);
        if (!items.length) return;
        const p = el("p", { class: "meta" }, name);
        card.appendChild(p);
        const ul = el("ul");
        items.forEach(r => {
          const li = el("li"); const b = el("button", {}, refLabel(r));
          b.addEventListener("click", () => select({ type: "hub", hub: refHub(r), spec: VIEWS.references.build() }));
          li.appendChild(b); ul.appendChild(li);
        });
        card.appendChild(ul);
      });
    }
  } else {
    const h = s.hub;
    const tags = s.spec.pairs.filter(p => p[1] === h.id).map(p => p[0]);
    card.appendChild(el("h2", {}, h.label));
    if (h.kind === "reference") {
      const r = h.ref;
      card.appendChild(el("p", { class: "meta" }, groupName(r.group)));
      card.appendChild(el("p", {}, r.title));
      card.appendChild(el("p", { class: "meta" }, [r.authors.replace(/\.$/, ""), [r.source, r.year].filter(Boolean).join(", ")].filter(Boolean).join(". ") + "."));
      const link = el("p", { class: "meta" });
      link.appendChild(r.doi
        ? el("a", { href: `https://doi.org/${r.doi}`, target: "_blank", rel: "noopener" }, "Open the paper")
        : el("a", { href: `https://scholar.google.com/scholar?q=${encodeURIComponent(r.title + " " + r.year)}`, target: "_blank", rel: "noopener" }, "Find the paper"));
      card.appendChild(link);
      const raw = el("details");
      raw.appendChild(el("summary", { class: "meta" }, "As listed in Scopus"));
      raw.appendChild(el("p", { class: "meta" }, r.raw));
      card.appendChild(raw);
      if (r.study) {
        const p = el("p", { class: "meta" }, "Also included in the review: ");
        const b = el("button", { class: "inline" }, studyLabel(byTag.get(r.study)));
        b.addEventListener("click", () => select({ type: "study", tag: r.study }));
        p.appendChild(b); card.appendChild(p);
      }
    }
    const verb = h.kind === "dataset" ? "Validated against by" : h.kind === "solver" ? "Used by" : "Cited by";
    card.appendChild(el("p", { class: "meta" }, `${verb} ${plural(tags.length, "study", "studies")}:`));
    card.appendChild(studyList(tags));
  }
}

/* ---------------------------------------------------------------
   Legend
   --------------------------------------------------------------- */
function legend(devices, hubName) {
  const box = document.getElementById("legend");
  box.replaceChildren();
  [...new Set(devices.map(d => d === "PA-OWC" ? "OWC" : d))].sort().forEach(d => {
    const item = el("span"); const sw = el("span", { class: "swatch" }); sw.style.background = deviceColor(d);
    item.appendChild(sw); item.appendChild(document.createTextNode(d)); box.appendChild(item);
  });
  if (hubName) {
    const item = el("span"); item.appendChild(el("span", { class: "swatch hub-swatch" }));
    item.appendChild(document.createTextNode(hubName)); box.appendChild(item);
  }
  box.appendChild(el("span", {}, "Drag to move, scroll to zoom, hover to see connections."));
}

/* ---------------------------------------------------------------
   Views and navigation (#validation, #models, #references, #citations)
   --------------------------------------------------------------- */
/* ---------------------------------------------------------------
   Figures of the review: the same plots as in the paper. Hovering a point
   names the study; clicking opens its card. No values are displayed.
   --------------------------------------------------------------- */
const FIGURES = [
  { id: "c0", n: 5, title: "Speed of sound against the wave conditions", note: "Each circle is a study, placed by the dimensionless water depth and wave height of its wave conditions, and coloured by the ratio between the reference speed of sound and the maximum orbital velocity." },
  { id: "h", n: 6, title: "Smoothing length", y: "{h}/Δ{p} [–]", note: "Smoothing length over the initial particle spacing, by kernel and dimensionality. Grey bars mark studies that do not report it." },
  { id: "visc", n: 7, title: "Viscosity treatment", y: "{α}_{w} [–] / {μ} [Pa·s]", note: "Artificial viscosity coefficient (squares) and dynamic viscosity of models with momentum viscous diffusion (circles). Bars give the plausible range when the value is not disclosed; dashed lines mark inviscid models; grey bars mark studies with no information." },
  { id: "H", n: 8, title: "Wave height over particle size", y: "{H}_{i}/Δ{p} [–]", note: "Incident wave height over the particle size; a line joins the two ends of a range. Grey bars mark studies without the values needed." },
  { id: "DL", n: 9, title: "Distance between wavemaker and device", y: "{D}_{wavemk}/{λ}_{i} [–]", note: "Distance between the wave-generating boundary and the device, over the wavelength. Grey bars mark studies without the values needed." },
  { id: "Ddp", n: 11, title: "Characteristic dimension over particle size", y: "{D̄}/Δ{p} [–]", note: "Characteristic dimension of the device over the particle size, by device group. Grey bars mark studies without the values needed." },
];
state.fig = "c0";
/* Mathematical labels. Markup: {x} italic, _{x} subscript, anything else upright.
   e.g. "{h}/Δ{p}", "{H}_{i}/Δ{p}", "{c}_{0}/{v}_{max}" */
const MATH_FONT = '"Times New Roman", "STIX Two Text", "Cambria Math", serif';
function mathParts(markup) {
  const parts = [];
  const re = /_\{([^}]*)\}|\{([^}]*)\}|([^{_]+|_)/g;
  let m;
  while ((m = re.exec(markup))) {
    if (m[1] !== undefined) parts.push({ text: m[1], sub: true, italic: /^[A-Za-zα-ω]$/.test(m[1]) });   // digits upright
    else if (m[2] !== undefined) parts.push({ text: m[2], italic: true });
    else parts.push({ text: m[3] });
  }
  return parts;
}
function mathSVG(textSel, markup, size = 15) {          // into an SVG <text>
  textSel.attr("font-family", MATH_FONT).attr("font-size", size);
  let down = false;
  mathParts(markup).forEach(p => {
    const t = textSel.append("tspan").text(p.text).attr("font-style", p.italic ? "italic" : "normal");
    if (p.sub && !down) { t.attr("dy", "0.32em").attr("font-size", size * 0.72); down = true; }
    else if (!p.sub && down) { t.attr("dy", "-0.32em"); down = false; }
    else if (p.sub) t.attr("font-size", size * 0.72);
  });
}
function mathHTML(markup) {                             // as an HTML span
  const span = el("span", { class: "math" }); span.style.fontFamily = MATH_FONT; span.style.fontSize = "15px";
  mathParts(markup).forEach(p => {
    let node = el(p.italic ? "i" : "span", {}, p.text);
    if (p.sub) { const sub = el("sub"); sub.appendChild(node); node = sub; }
    span.appendChild(node);
  });
  return span;
}

const envColor = env => cssVar(env === "3-D" ? "--owc" : "--owsc");

function figPicker() {
  const box = document.getElementById("figpick");
  box.replaceChildren();
  FIGURES.forEach(f => {
    const b = el("button", { class: "chip", "aria-pressed": String(state.fig === f.id) }, `Figure ${f.n}`);
    b.title = f.title;
    b.addEventListener("click", () => { state.fig = f.id; render(); });
    box.appendChild(b);
  });
}

function tipOn(event, text) {
  const tip = document.getElementById("tip");
  tip.textContent = text; tip.hidden = false;
  tip.style.left = `${event.clientX + 12}px`; tip.style.top = `${event.clientY + 12}px`;
}
function tipOff() { document.getElementById("tip").hidden = true; }

function renderFigures() {
  figPicker();
  const fig = FIGURES.find(f => f.id === state.fig);
  document.getElementById("chart-title").textContent = `Figure ${fig.n} of the review: ${fig.title}`;
  document.getElementById("note").textContent = fig.note;
  const chart = document.getElementById("chart");
  chart.replaceChildren();
  const width = Math.max(chart.clientWidth, 320), height = 440;
  const m = { top: 20, right: 24, bottom: 46, left: 62 };
  const svg = d3.select(chart).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  clearOnBackground(svg);
  const marks = [];                                     // [selection, tag] for highlighting
  const hook = (sel) => sel.attr("class", "mark")
    .on("mouseenter", (e, d) => tipOn(e, byTag.get(d.tag).label))
    .on("mousemove", (e, d) => tipOn(e, byTag.get(d.tag).label))
    .on("mouseleave", tipOff)
    .on("click", (e, d) => select({ type: "study", tag: d.tag }));
  const axes = (x, y, xLabel, yLabel, yLog) => {
    const ticks = yLog ? y.ticks(6).filter(t => [1, 2, 5].includes(+t.toExponential(0).split("e")[0])) : y.ticks(6);
    svg.append("g").attr("class", "year-grid").selectAll("line").data(ticks).join("line")
      .attr("x1", m.left).attr("x2", width - m.right).attr("y1", d => y(d)).attr("y2", d => y(d));
    svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - m.bottom})`).call(d3.axisBottom(x).ticks(8));
    svg.append("g").attr("class", "axis").attr("transform", `translate(${m.left},0)`)
      .call(d3.axisLeft(y).tickValues(ticks).tickFormat(d3.format("~g")));
    const xl = svg.append("text").attr("x", (m.left + width - m.right) / 2).attr("y", height - 8).attr("text-anchor", "middle");
    if (xLabel.includes("{")) mathSVG(xl, xLabel); else xl.attr("font-size", 13).text(xLabel);
    mathSVG(svg.append("text").attr("transform", `translate(18,${(height - m.bottom + m.top) / 2}) rotate(-90)`)
      .attr("text-anchor", "middle"), yLabel);
  };
  const box = document.getElementById("legend");
  box.replaceChildren();
  const key = (colour, text, symbol = d3.symbolCircle, hollow = false) => {
    const item = el("span");
    const s = d3.select(item).append("svg").attr("width", 14).attr("height", 14);
    s.append("path").attr("transform", "translate(7,7)").attr("d", d3.symbol(symbol, 60)())
      .attr("fill", hollow ? "none" : colour).attr("stroke", colour).attr("stroke-width", 1.5);
    item.appendChild(text.includes("{") ? mathHTML(text) : document.createTextNode(text)); box.appendChild(item);
  };

  if (fig.id === "c0") {
    const rows = studies.filter(s => s.fig.c0);
    const x = d3.scaleLinear().domain([0, d3.max(rows, s => s.fig.c0[0]) * 1.08]).nice().range([m.left, width - m.right]);
    const y = d3.scaleLinear().domain([0, d3.max(rows, s => s.fig.c0[1]) * 1.08]).nice().range([height - m.bottom, m.top]);
    const colour = d3.scaleSequential(d3.interpolateCool).domain([0, 100]).clamp(true);
    axes(x, y, "{k}{h}_{0}", "{H}_{i}/{h}_{0}", false);

    // Isolines of sqrt(g h)/v_max, as in pre_c0.m: second-order Stokes velocity at the free
    // surface, with h = 1 (the ratio depends only on kh and H/h)
    const [kx0, kx1] = x.domain(), [hy0, hy1] = y.domain();
    const nx = 160, ny = 120, grid = new Array(nx * ny);
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const kh = Math.max(0.02, kx0 + (kx1 - kx0) * i / (nx - 1));
        const H = Math.max(0.005, hy0 + (hy1 - hy0) * j / (ny - 1));
        const omega = Math.sqrt(9.81 * kh * Math.tanh(kh)), T = 2 * Math.PI / omega, L = 2 * Math.PI / kh;
        const c1 = H * 9.81 * T / (2 * L);
        const c2 = 0.75 * (Math.PI * H / L) ** 2 * (L / T) / Math.sinh(kh) ** 4 * Math.cosh(2 * kh);
        grid[j * nx + i] = Math.sqrt(9.81) / (c1 + c2);
      }
    }
    const levels = [3, 5, 10, 20, 50];
    const iso = svg.append("g").attr("class", "isolines");
    const toXY = ([px, py]) => [x(kx0 + (kx1 - kx0) * px / (nx - 1)), y(hy0 + (hy1 - hy0) * py / (ny - 1))];
    const onEdge = ([px, py]) => px <= 0.51 || py <= 0.51 || px >= nx - 1.51 || py >= ny - 1.51;
    const line = d3.line();
    d3.contours().size([nx, ny]).thresholds(levels)(grid).forEach(c => {
      // contour rings are closed along the plot edges: keep only the parts inside
      c.coordinates.flat(1).forEach(ring => {
        let run = [];
        const flush = () => {
          if (run.length > 1) iso.append("path").attr("d", line(run.map(toXY))).attr("fill", "none")
            .attr("stroke", cssVar("--muted")).attr("stroke-width", 0.9).attr("stroke-opacity", 0.7);
          run = [];
        };
        ring.forEach(pt => { if (onEdge(pt)) flush(); else run.push(pt); });
        flush();
      });
      // label at the right-most point of the line that lies inside the plot
      const pts = c.coordinates.flat(2).map(([px, py]) => [x(kx0 + (kx1 - kx0) * px / (nx - 1)), y(hy0 + (hy1 - hy0) * py / (ny - 1))])
        .filter(([X, Y]) => X > m.left + 20 && X < width - m.right - 20 && Y > m.top + 10 && Y < height - m.bottom - 10);
      if (!pts.length) return;
      const [X, Y] = pts.reduce((a, b) => (b[0] > a[0] ? b : a));
      iso.append("text").attr("x", X - 4).attr("y", Y - 4).attr("text-anchor", "end").attr("font-size", 11)
        .attr("class", "label").style("font-weight", 400).text(c.value);
    });
    const dots = svg.append("g").selectAll("circle").data(rows.map(s => ({ tag: s.tag, v: s.fig.c0 }))).join("circle")
      .attr("cx", d => x(d.v[0])).attr("cy", d => y(d.v[1])).attr("r", 6)
      .attr("fill", d => colour(d.v[2])).attr("stroke", cssVar("--ink")).attr("stroke-width", 0.6).call(hook);
    marks.push(dots);
    const item = el("span");
    const s = d3.select(item).append("svg").attr("width", 120).attr("height", 12);
    const grad = s.append("defs").append("linearGradient").attr("id", "c0grad");
    d3.range(0, 1.01, 0.1).forEach(t => grad.append("stop").attr("offset", t).attr("stop-color", colour(t * 100)));
    s.append("rect").attr("width", 120).attr("height", 12).attr("fill", "url(#c0grad)");
    item.appendChild(mathHTML("{c}_{0}/{v}_{max}"));
    item.appendChild(document.createTextNode(", from low to ≥ 100"));
    box.appendChild(item);
    const isoKey = el("span");
    isoKey.appendChild(el("span", { class: "line-sample" }));
    isoKey.appendChild(document.createTextNode("Isolines of "));
    isoKey.appendChild(mathHTML("√({g}{h}_{0})/{v}_{max}"));
    box.appendChild(isoKey);
  } else {
    const n = studies.length;
    const x = d3.scaleLinear().domain([0, n + 1]).range([m.left, width - m.right]);
    let get, style, yDomain;
    if (fig.id === "visc") {
      const pts = studies.filter(s => s.fig.visc && s.fig.visc[1]).map(s => s.fig.visc[1]);
      yDomain = [Math.min(0.0003, d3.min(pts)), Math.max(0.08, d3.max(pts))];
    } else {
      const pts = studies.flatMap(s => s.fig[fig.id] || []).filter(v => v > 0);
      yDomain = [d3.min(pts) / 1.4, d3.max(pts) * 1.4];
    }
    const y = d3.scaleLog().domain(yDomain).range([height - m.bottom, m.top]);
    axes(x, y, "Publication Tag", fig.y, true);
    const [y0, y1] = y.range();
    const groups = { OWSC: "--owsc", TBW: "--owsc", PA: "--pa", TMP: "--pa", OWC: "--owc", WA: "--wa", OWEC: "--owec" };

    const series = [], bars = [], dashed = [];
    studies.forEach(s => {
      const f = s.fig;
      if (fig.id === "visc") {
        if (!f.visc) { bars.push({ tag: s.tag }); return; }
        const [kind, value] = f.visc;
        if (kind === "inv") { dashed.push({ tag: s.tag }); return; }
        const colour = cssVar(kind === "art" ? "--owc" : "--owsc"), symbol = kind === "art" ? d3.symbolSquare : d3.symbolCircle;
        if (value) series.push({ tag: s.tag, v: [value, value], colour, symbol });
        else series.push({ tag: s.tag, v: kind === "art" ? [0.005, 0.05] : [0.0005, 0.002], colour, symbol, range: true });
        return;
      }
      const v = f[fig.id];
      if (!v) { bars.push({ tag: s.tag }); return; }
      let colour = envColor(f.env), symbol = d3.symbolCircle, hollow = false;
      if (fig.id === "h") {
        symbol = f.kernel === "Cubic" ? d3.symbolTriangle : f.kernel === "Quintic" ? d3.symbolCircle : d3.symbolDiamond;
        hollow = f.env === "2-D";
      }
      if (fig.id === "Ddp") colour = cssVar(groups[f.type] || "--other");
      series.push({ tag: s.tag, v, colour, symbol, hollow });
    });

    svg.append("g").selectAll("rect").data(bars).join("rect").attr("class", "nodata")
      .attr("x", d => x(d.tag) - 2.5).attr("width", 5).attr("y", y1).attr("height", y0 - y1);
    const dash = svg.append("g").selectAll("line").data(dashed).join("line")
      .attr("x1", d => x(d.tag)).attr("x2", d => x(d.tag)).attr("y1", y1).attr("y2", y0)
      .attr("stroke", cssVar("--pa")).attr("stroke-width", 2.5).attr("stroke-dasharray", "5 4").call(hook);
    const lines = svg.append("g").selectAll("line").data(series.filter(d => d.v[0] !== d.v[1])).join("line")
      .attr("x1", d => x(d.tag)).attr("x2", d => x(d.tag)).attr("y1", d => y(d.v[0])).attr("y2", d => y(d.v[1]))
      .attr("stroke", d => d.colour).attr("stroke-width", d => d.range ? 4 : 1.8).call(hook);
    const pts = svg.append("g").selectAll("path").data(series.filter(d => !d.range).flatMap(d =>
        (d.v[0] === d.v[1] ? [d.v[0]] : d.v).map(val => ({ ...d, val })))).join("path")
      .attr("transform", d => `translate(${x(d.tag)},${y(d.val)})`).attr("d", d => d3.symbol(d.symbol, 52)())
      .attr("fill", d => d.hollow ? cssVar("--surface") : d.colour).attr("stroke", d => d.colour).attr("stroke-width", 1.4).call(hook);
    marks.push(dash, lines, pts);

    if (fig.id === "h") {
      key(cssVar("--owc"), "3-D, Quintic"); key(cssVar("--owc"), "3-D, Cubic", d3.symbolTriangle);
      key(cssVar("--owsc"), "2-D, Quintic", d3.symbolCircle, true); key(cssVar("--owsc"), "2-D, Cubic", d3.symbolTriangle, true);
      key(cssVar("--owc"), "Other kernel", d3.symbolDiamond);
    } else if (fig.id === "visc") {
      key(cssVar("--owc"), "{α}_{w}", d3.symbolSquare); key(cssVar("--owsc"), "{μ}");
      key(cssVar("--pa"), "Inviscid (dashed line)");
    } else if (fig.id === "Ddp") {
      [["OWSC+TBW", "--owsc"], ["PA+TMP", "--pa"], ["OWC", "--owc"], ["WA", "--wa"], ["OWEC", "--owec"]]
        .forEach(([t, c]) => key(cssVar(c), t));
    } else {
      key(cssVar("--owc"), "3-D"); key(cssVar("--owsc"), "2-D");
    }
  }
  box.appendChild(el("span", {}, "Hover a point for the study; click for its details."));

  applyFocus = () => {
    const sel = state.selected && state.selected.type === "study" ? state.selected.tag : null;
    marks.forEach(m => m.classed("selected-mark", d => d.tag === sel)
                      .style("opacity", d => sel === null || d.tag === sel ? null : 0.35));
  };
  applyFocus();
}

function render() {
  if (simulation) simulation.stop();
  const view = VIEWS[state.view];
  const spec = view.build();
  document.getElementById("fig-num").textContent = state.view === "figures"
    ? "From the paper" : `Map ${["validation", "models", "references", "citations"].indexOf(state.view) + 1}`;
  document.getElementById("chart-title").textContent = view.title;
  const source = document.getElementById("source");
  source.replaceChildren(el("strong", {}, "Source: "), document.createTextNode(view.source));
  document.getElementById("note").textContent = spec.note;
  const toggleWrap = document.getElementById("toggle-wrap");
  toggleWrap.hidden = !view.singlesText || spec.empty;
  document.getElementById("toggle-text").textContent = view.singlesText || "";
  document.getElementById("toggle").checked = !!state.toggles[state.view];
  document.getElementById("chips").hidden = state.view !== "references" || spec.empty;
  applyFocus = null;
  if (spec.empty) {
    const chart = document.getElementById("chart");
    chart.replaceChildren(el("p", { class: "empty-state" },
      "No reference data yet. Add scopus_references.csv (a Scopus export of the included studies with their references) and run build_site.py again."));
    document.getElementById("legend").replaceChildren();
    return;
  }
  document.getElementById("figpick").hidden = state.view !== "figures";
  tipOff();
  if (state.view === "figures") renderFigures();
  else if (state.view === "citations") renderTimeline();
  else if (state.view === "references") renderExplorer(spec);
  else renderHubMap(spec, view);
}

function show(view) {
  if (DATA.figuresOnly) view = "figures";
  if (DATA.noFigures && view === "figures") view = "validation";
  if (!VIEWS[view]) view = "validation";
  state.view = view;
  if (state.selected && state.selected.type === "hub" && !(view === "references" && state.selected.hub.kind === "reference")) {
    state.selected = null; renderCard();
  }
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  render();
  renderCard();
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  if (location.hash !== "#" + b.dataset.view) location.hash = b.dataset.view; else show(b.dataset.view);
}));
document.getElementById("toggle").addEventListener("change", e => { state.toggles[state.view] = e.target.checked; render(); });
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 200); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

renderCard();
show(DATA.figuresOnly ? "figures" : (location.hash.slice(1) || "validation"));
</script>
